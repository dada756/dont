name: Find Top 50 Heaviest Images

# The workflow_dispatch event enables the manual "Run workflow" button
on:
  workflow_dispatch:

jobs:
  profile-media-size:
    name: Profile S3/CloudFront Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Reliable version for async/httpx

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]==0.27.0"

      # Runs the script. The script's progress and the final Top 50 list 
      # will be beautifully formatted inside the logs of this specific step.
      - name: 🚀 Execute Size Profiler & Print Top 50
        run: python script.py
