name: Find Top 50 Heaviest Images

on:
  workflow_dispatch:

jobs:
  profile-media-size:
    name: Profile S3/CloudFront Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]==0.27.0"

      - name: 🚀 Execute Size Profiler & Print Top 50
        run: python script.py
        
      # Uploads the exported txt file from the repository root so you can download it
      - name: 💾 Upload Results File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heavy-images-results
          path: top_50_*.txt
          retention-days: 7
